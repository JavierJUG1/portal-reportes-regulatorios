# Proxy HTTPS (nginx) delante del portal. Copiar a /etc/nginx/sites-available/, reemplazar HOST_DEL_PORTAL
# por el dominio del portal y las rutas del certificado, y activar con un enlace en sites-enabled.
# La URL https://HOST_DEL_PORTAL/api/auth/callback debe estar en OAUTH_REDIRECT_URI (backend/.env)
# y en las Redirect URIs del OAuth Client de ERPNext.

server {
    listen 80;
    server_name HOST_DEL_PORTAL;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name HOST_DEL_PORTAL;

    ssl_certificate     /etc/letsencrypt/live/HOST_DEL_PORTAL/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOST_DEL_PORTAL/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
